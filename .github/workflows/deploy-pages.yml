name: Deploy production and development preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out production
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Check out development preview
        uses: actions/checkout@v4
        with:
          ref: feature/planning
          path: preview

      - name: Add development preview
        run: |
          mkdir -p site/dev
          cp preview/index.html site/dev/
          cp preview/styles.css site/dev/
          cp preview/app.js site/dev/
          cp preview/importer.js site/dev/
          cp preview/config.js site/dev/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Production runs assemble both environments.
# Update this marker when a development preview should be republished: planning-v3
