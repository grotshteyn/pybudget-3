name: Deploy production and development preview

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out production
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Check out development preview
        uses: actions/checkout@v4
        with:
          ref: dev
          path: preview

      - name: Verify environment configs
        run: |
          grep -F 'https://syihmgdhyhyhtdrwuqdo.supabase.co' site/config.js
          grep -F 'https://eaijvzlvecezduryigoa.supabase.co' preview/config.dev.js
          if grep -Fq 'https://syihmgdhyhyhtdrwuqdo.supabase.co' preview/config.dev.js; then
            echo "Development config points to production Supabase."
            exit 1
          fi
          if grep -Fq 'https://eaijvzlvecezduryigoa.supabase.co' site/config.js; then
            echo "Production config points to development Supabase."
            exit 1
          fi

      - name: Add development preview
        run: |
          mkdir -p site/dev
          cp preview/index.html site/dev/
          cp preview/styles.css site/dev/
          cp preview/app.js site/dev/
          cp preview/importer.js site/dev/
          cp preview/config.dev.js site/dev/config.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# The artifact always contains production from main and development from dev.
