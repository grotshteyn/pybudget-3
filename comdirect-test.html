<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>pyBudget comdirect diagnostic — mock only</title>
<style>body{font:16px system-ui;max-width:720px;margin:3rem auto;padding:0 1rem}fieldset{display:grid;gap:.75rem}label{display:grid;gap:.25rem}input,button{font:inherit;padding:.55rem}pre{white-space:pre-wrap;background:#eee;padding:1rem}.warning{font-weight:700}</style>
</head>
<body>
<h1>comdirect connection diagnostic</h1>
<p class="warning">MOCK MODE ONLY — this page does not contact comdirect, Supabase, or import transactions.</p>
<form id="credentials">
<fieldset><legend>Simulated credentials</legend>
<label>Client ID <input name="client_id" required autocomplete="off"></label>
<label>Client secret <input name="client_secret" type="password" required autocomplete="off"></label>
<label>Zugangsnummer <input name="access_number" required autocomplete="off"></label>
<label>PIN <input name="pin" type="password" required autocomplete="off"></label>
<button>Start mock authentication</button></fieldset>
</form>
<section id="twofa" hidden><h2>2FA</h2><p id="challenge"></p><label>Optional TAN for non-push mock <input id="tan" type="password" autocomplete="off"></label><button id="confirm" type="button">Confirm mock 2FA</button></section>
<h2>Sanitized diagnostic</h2><pre id="status">idle</pre>
<script src="comdirect-test-flow.js"></script>
<script>
const flow=PyBudgetComdirectFlow.createFlow(PyBudgetComdirectFlow.createMockTransport({delay:150}));
const status=document.querySelector("#status"), twofa=document.querySelector("#twofa"), challenge=document.querySelector("#challenge");
function render(s){status.textContent=JSON.stringify(s,null,2);twofa.hidden=s.state!=="awaiting_2fa";challenge.textContent=s.challenge?.text||""}
document.querySelector("#credentials").addEventListener("submit",async(e)=>{e.preventDefault();const f=new FormData(e.currentTarget);const c=Object.fromEntries(f.entries());render({state:"authenticating"});const s=await flow.start(c);e.currentTarget.reset();render(s)});
document.querySelector("#confirm").addEventListener("click",async()=>{render({state:"activating_2fa"});const tan=document.querySelector("#tan");const s=await flow.confirm({tan:tan.value});tan.value="";render(s)});
render(flow.snapshot());
</script>
</body></html>
